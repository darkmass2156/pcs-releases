<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111a2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow2)"/>
  <!-- live line -->
  <path d="M860 240 C 885 240 895 200 915 204 S 945 248 970 236 S 1000 150 1025 166 S 1055 236 1080 222 S 1110 120 1135 136 S 1165 196 1190 160 L 1230 128"
        fill="none" stroke="url(#wave)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1230" cy="128" r="7" fill="#3B82F6"/>
  <circle cx="1230" cy="128" r="15" fill="#3B82F6" fill-opacity="0.25"/>
  <!-- logo tile with drop -->
  <rect x="80" y="96" width="128" height="128" rx="30" fill="url(#tile)"/>
  <path d="M144 124 C 144 124 116 158 116 178 A 28 28 0 0 0 172 178 C 172 158 144 124 144 124 Z" fill="#fff"/>
  <!-- wordmark -->
  <text x="240" y="178" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#E6EDF3" letter-spacing="-3">PCS</text>
  <text x="244" y="218" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#9BA7B4">Sensors · Reflex fan control · Crash analyzer</text>
  <!-- alpha pill -->
