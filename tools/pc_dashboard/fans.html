<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCS Fans</title>
<!-- Fans tab, step 1 (2026-11-23, docs/changes/fan_tab_proposal.md): READ-ONLY. Shows every fan / pump header, who drives
     it and why. Sends nothing, writes nothing. Data: GET /fans/state (reader "fans" block, header duty / rpm, fan_req.json;
     needs the service restart that adds it), GET /status (dashboard requests and reasons), GET /pcdetail (rpm per header,
     board temperatures). Works with whatever of these answers. -->
<script src="/theme.js"></script>
<script src="/boards.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root { --bg: #0D1117; --card: #161B22; --card2: #1F2630; --label: #E6EDF3; --label2: rgba(230,237,243,.62); --label3: rgba(230,237,243,.30);
  --sep: rgba(240,246,252,.09); --fill: rgba(240,246,252,.06); --accent: #3B82F6; --accent2: #22D3EE; --on-accent: #fff; --blue: #3B82F6;
  --teal: #22D3EE; --green: #3FB950; --orange: #F0A23B; --red: #F85149; --yellow: #E3B341;
  --font: "Plus Jakarta Sans", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--label); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum", "cv11", "ss01"; }
body { min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(900px 520px at 12% -8%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
              radial-gradient(800px 600px at 100% 0%, color-mix(in srgb, var(--blue) 12%, transparent), transparent 70%); }
main { max-width: 1440px; margin: 0 auto; padding: 30px 40px 56px; }
.head { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 22px; flex-wrap: wrap; }
.head .hi { color: var(--label2); font-size: 14px; font-weight: 500; }
.head h1 { margin: 4px 0 0; font-size: 33px; line-height: 1.15; font-weight: 650; letter-spacing: -.025em; }
.head .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 9px; padding: 8px 14px 8px 12px; border-radius: 999px; background: var(--card);
  border: 1px solid var(--sep); font-weight: 600; font-size: 13px; white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--label3); flex: none; }
.chip.pcs i { background: var(--green); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 22%, transparent); }
.chip.fc i { background: var(--blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 22%, transparent); }
.chip.bios i { background: var(--orange); box-shadow: 0 0 0 4px color-mix(in srgb, var(--orange) 22%, transparent); }
.chip.bad i { background: var(--red); box-shadow: 0 0 0 4px color-mix(in srgb, var(--red) 22%, transparent); }
.chip span { color: var(--label2); font-weight: 500; }
.sub { color: var(--label2); font-size: 13px; margin: -10px 0 20px; }
.sub b { color: var(--label); font-weight: 600; }

.card { background: color-mix(in srgb, var(--card) 92%, transparent); border: 1px solid var(--sep); border-radius: 20px; min-width: 0;
  backdrop-filter: blur(20px); }
.grid { display: grid; grid-template-columns: minmax(380px, 560px) 1fr; gap: 18px; align-items: start; }
.boardc { position: sticky; top: 20px; padding: 16px 16px 10px; }
.boardc h2, .grp h2 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.boardc .bh { display: flex; align-items: baseline; gap: 10px; padding: 2px 4px 8px; }
.boardc .bh span { color: var(--label2); font-size: 12.5px; }
#mb { width: 100%; height: auto; display: block; }
#mb [data-rotor] { cursor: pointer; }
/* selected header (hover / focus on its card) */
#mb .bd-hdr.sel { fill: color-mix(in srgb, var(--accent) 70%, transparent) !important; stroke: var(--accent) !important; stroke-width: 2.5 !important; }
#mb .bd-lead.sel { stroke: var(--accent) !important; stroke-width: 2.2; }
#mb .bd-rotor.sel .bd-rring { stroke: var(--accent); stroke-width: 2.4; fill: color-mix(in srgb, var(--accent) 18%, var(--card)); }
.bnote { color: var(--label3); font-size: 12px; padding: 6px 4px 2px; }

.grp { margin-bottom: 18px; }
.grp .gh { display: flex; align-items: baseline; gap: 10px; padding: 0 4px 10px; flex-wrap: wrap; }
.grp .gh span { color: var(--label2); font-size: 12.5px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.fan { padding: 16px 18px 14px; transition: box-shadow .2s, border-color .2s; outline: none; }
.fan:hover, .fan:focus-visible, .fan.sel { border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.fan .top { display: flex; align-items: flex-start; gap: 10px; }
.fan .nm { flex: 1; min-width: 0; }
.fan .nm b { display: block; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.fan .nm span { color: var(--label2); font-size: 12.5px; }
.who { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; padding: 4px 9px; border-radius: 999px; white-space: nowrap;
  background: var(--fill); color: var(--label2); }
.who.pcs { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.who.fc { background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); }
.who.bios { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.nums { display: flex; gap: 26px; margin: 12px 0 6px; align-items: baseline; }
.nums div { min-width: 0; }
.nums b { font-size: 30px; font-weight: 600; letter-spacing: -.04em; line-height: 1; }
.nums small { font-size: 13px; color: var(--label2); font-weight: 500; margin-left: 3px; }
.nums .k { display: block; font-size: 11.5px; color: var(--label2); font-weight: 600; margin-top: 4px; }
.nums .duty b { color: var(--accent); }
.bar { height: 5px; border-radius: 3px; background: var(--fill); overflow: hidden; margin: 6px 0 10px; }
.bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--accent-grad, var(--accent)); transition: width .6s; }
.why { font-size: 13px; font-weight: 600; display: flex; gap: 7px; align-items: baseline; }
.why::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; transform: translateY(-1px); }
.why.idle::before { background: var(--label3); }
.parts { color: var(--label2); font-size: 12px; margin-top: 4px; min-height: 17px; }
.parts em { font-style: normal; color: var(--label); font-weight: 600; }
.spark { margin-top: 10px; }
.spark svg { width: 100%; height: 54px; display: block; overflow: visible; }
.spark .lg { display: flex; gap: 14px; font-size: 11.5px; color: var(--label3); font-weight: 500; margin-top: 3px; }
.spark .lg i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.spark .lg .r { margin-left: auto; }
.split { margin-top: 8px; font-size: 11.5px; color: var(--label3); }
.empty { color: var(--label2); font-size: 13px; padding: 4px; }
.foot { color: var(--label3); font-size: 12px; margin-top: 8px; padding: 0 4px; }

/* ---- fan control on other PCs (standalone, 2026-11-23) ---- */
.ctl { padding: 16px 18px; margin-bottom: 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.ctl .t { flex: 1; min-width: 220px; }
.ctl .t b { font-size: 15px; font-weight: 650; display: block; }
.ctl .t span { color: var(--label2); font-size: 12.5px; }
.sw { position: relative; width: 46px; height: 26px; flex: none; }
.sw input { opacity: 0; width: 0; height: 0; position: absolute; }
.sw i { position: absolute; inset: 0; border-radius: 13px; background: var(--fill); border: 1px solid var(--sep); cursor: pointer; transition: background .2s; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--label2); transition: transform .2s, background .2s; }
.sw input:checked + i { background: var(--accent); }
.sw input:checked + i::after { transform: translateX(20px); background: #fff; }
.ed input[type=text], .ed input[type=number], .ed select { background: var(--card2); color: var(--label); border: 1px solid var(--sep); border-radius: 9px;
  padding: 6px 9px; font: 600 13px var(--font); min-width: 0; }
.ed input[type=number] { width: 72px; }
.ed .nmin { font-size: 15px; font-weight: 650; width: 100%; background: transparent; border-color: transparent; padding: 3px 6px; margin-left: -6px; }
.ed .nmin:hover, .ed .nmin:focus { border-color: var(--sep); background: var(--card2); outline: none; }
.btn { background: var(--card2); color: var(--label); border: 1px solid var(--sep); border-radius: 999px; padding: 6px 13px; font: 600 12.5px var(--font); cursor: pointer; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.del { color: var(--red); }
.row2 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--label2); }
.gcard { padding: 16px 18px; }
.gcard .gt { display: flex; gap: 10px; align-items: center; }
.gcard .gt .nmin { flex: 1; }
.gl { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; margin-top: 12px; }
.gl label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--label2); }
.gl label.wide { grid-column: 1 / -1; }
.gl select { width: 100%; }
.live { margin-top: 12px; display: flex; gap: 18px; align-items: baseline; font-size: 12.5px; color: var(--label2); flex-wrap: wrap; }
.live b { font-size: 22px; color: var(--label); font-weight: 600; letter-spacing: -.03em; }
.curve { margin-top: 10px; }
.curve svg { width: 100%; height: 70px; display: block; }
.warn { color: var(--orange); font-size: 12px; margin-top: 6px; }
.saved { color: var(--label3); font-size: 12px; }

@media (max-width: 1100px) {
  .grid { grid-template-columns: 1fr; }
  .boardc { position: static; max-width: 640px; }
}
@media (max-width: 720px) {
  main { padding: 20px 16px 40px; }
  .head h1 { font-size: 28px; }
  .cards { grid-template-columns: 1fr; }
  .nums { gap: 18px; }
}
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body class="shell">
<aside class="rail" data-page="fans"></aside>
<main>
  <div class="head">
    <div><div class="hi" id="hi">Every header and what drives it · read-only</div><h1>Fans</h1></div>
    <div class="spacer"></div>
    <div class="chip" id="ctlChip"><i></i>Control: <span id="ctlTxt">…</span></div>
  </div>
  <div class="sub" id="ctlSub">Loading…</div>

  <div class="grid">
    <div class="card boardc">
      <div class="bh"><h2 id="mbTitle">Motherboard</h2><span>headers light up while they spin</span></div>
      <svg id="mb" viewBox="0 0 10 10"></svg>
      <div class="bnote">Click a rotor to jump to its header.</div>
    </div>
    <div id="groups"></div>
  </div>
  <div class="foot" id="foot"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => typeof v === "number" && isFinite(v);
const r0 = v => num(v) ? Math.round(v) : null;

// This PC's headers (CLAUDE.md "P1 and case fans", hwinfo_out.FAN_CH, sensors_src.FANS). ch = NCT6701D control index.
// Grouping is the recommended one, display only in this step (regrouping comes with the setup wizard, step 2).
const HDR = [
  { ch: 1, hw: "CPU", name: "CPU_FAN", nct: "Fan #2", role: "Rear 120 rad · intake", group: "rads", req: "req_rad", split: true },
  { ch: 2, hw: "Chassis2", name: "CHA_FAN2", nct: "Fan #3", role: "Front 360 rad · intake", group: "rads", req: "req_rad", split: true },
  { ch: 0, hw: "Chassis1", name: "CHA_FAN1", nct: "Fan #1", role: "Top exhaust", group: "top", req: "req_top", split: true },
  { ch: 5, hw: "W_PUMP+", name: "W_PUMP+", nct: "Fan #6", role: "P1 · D5 pump", group: "pump", req: "req_p1", pump: true },
  { ch: 6, hw: "AIO Pump", name: "AIO_PUMP", nct: "Fan #7", role: "PSU fan", group: "psu", req: "req_psu" },
];
const GROUPS = [
  ["rads", "Radiators", "rear 120 + front 360 · one request drives both"],
  ["top", "Top exhaust", ""],
  ["pump", "Pump", "P1, the in-case D5"],
  ["psu", "PSU", "the PSU fan on the AIO_PUMP header"],
  ["other", "Other headers", "not driven by PCS · their BIOS settings apply"],
];
const ROLES = { CPU_FAN: "rear 120 rad", CHA_FAN1: "top exhaust", CHA_FAN2: "front 360 rad", AIO_PUMP: "PSU fan",
                "W_PUMP+": "P1 · D5 pump" };            // labels on the board drawing, as index.html MB_ROLES
const PROG = { passive: "Passive", daily: "Daily", oc: "Overclocking", auto: "Auto", bench: "Benchmark", off: "Off", manual: "Manual" };
const HIST_S = 600;                                  // 10 min at 1 s, in memory only
const hist = {};                                     // ch -> [[t, duty, rpm], ...]

let FS = null, FS_ok = null, FS_next = 0, ST = null, DET = null, mbDef = null, mbBuilt = false, others = [];

// ---------------------------------------------------------------- board
(async () => {
  let id = "";
  try { id = (await (await fetch("/prefs", { cache: "no-store" })).json()).board; } catch (e) {}
  if (!id || !PCSBoard.boards[id]) {
    try { const b = await (await fetch("/board/detect")).json(); id = PCSBoard.match([b.maker, b.product].join(" · ")); } catch (e) {}
  }
  mbDef = PCSBoard.boards[id] || PCSBoard.boards["generic-atx"];
  $("mbTitle").textContent = mbDef.name;
})();
function boardName(h) {                              // the name the board drawing uses for this header (generic: its hw key)
  const bh = mbDef && (mbDef.headers || []).find(x => x.hw === h.hw);
  return bh ? bh.name : h.hw;
}
function select(h, on) {
  const svg = $("mb"); if (!svg || !h || !h.hw) return;
  const n = CSS.escape(boardName(h));
  svg.querySelectorAll(`[data-hdr="${n}"],[data-lead="${n}"],[data-rotor="${n}"]`).forEach(e => e.classList.toggle("sel", on));
}
$("mb").addEventListener("click", e => {
  const ro = e.target.closest("[data-rotor]"); if (!ro) return;
  const nm = ro.getAttribute("data-rotor");
  const h = HDR.find(x => boardName(x) === nm || x.hw === nm);
  const el = h && document.querySelector(`.fan[data-ch="${h.ch}"]`);
  if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.focus({ preventScroll: true }); }
});

// ---------------------------------------------------------------- who drives what
function readerFresh() { return FS && num(FS.reader_t) && Date.now() / 1000 - FS.reader_t < 10; }   // same PC: page and reader share the clock
function controller(h) {
  if (!FS_ok) return { k: "", t: "Unknown" };
  const F = FS.fans;
  if (readerFresh() && (!F || (ST && ST.standalone))) return { k: "bios", t: "Not PCS" };   // monitor only: PCS never drives them
  if (!readerFresh() || !F) return { k: "", t: "Unknown" };
  const m = String(F.mode || "");
  if (m.startsWith("blocked")) return { k: "fc", t: "FanControl" };
  if (m.startsWith("active")) return F.applied && F.applied[h.ch] != null ? { k: "pcs", t: "PCS" } : { k: "bios", t: "BIOS" };
  if (m.startsWith("stale") || m.startsWith("idle")) return { k: "bios", t: "BIOS" };
  return { k: "", t: "Unknown" };
}
function statusLine() {
  const chip = $("ctlChip"), set = (k, t, sub) => { chip.className = "chip " + k; $("ctlTxt").textContent = t; $("ctlSub").innerHTML = sub; };
  const prog = ST ? (PROG[ST.program] || ST.name || ST.program || "–") : null;
  const progTxt = prog ? ` · program <b>${esc(prog)}</b>` : "";
  if (FS_ok === false) return set("", "unknown", "The service does not offer <b>/fans/state</b> yet (it needs a restart): duty and controller are " +
    "unknown, rpm and the dashboard's requests are shown" + progTxt + ".");
  if (FS_ok == null) return set("", "…", "Loading…");
  if (!readerFresh()) return set("bad", "unknown", "The sensor reader is not answering" +
    (num(FS.reader_t) ? ` (last data ${Math.round(Date.now() / 1000 - FS.reader_t)} s ago)` : "") + ". Headers keep their last duty until it restarts." + progTxt);
  if (!FS.fans || (ST && ST.standalone)) return set("bios", "Watching", "PCS only reads the headers on this PC: speed and duty " +
    "as the board reports them. Your BIOS or fan software controls every fan.");
  const F = FS.fans || {}, m = String(F.mode || "");
  if (m.startsWith("active")) {
    const n = Object.keys(F.applied || {}).length;
    return set("pcs", "PCS", `The sensor reader drives <b>${n}</b> header${n === 1 ? "" : "s"} from the dashboard's requests` +
      (m.includes("instant floor") ? ", with the instant floor on" : "") + progTxt +
      (num(FS.req_age) ? ` · request ${FS.req_age.toFixed(1)} s old` : "") + ". The other headers run their BIOS curves.");
  }
  if (m.startsWith("blocked")) return set("fc", "FanControl", "FanControl is running, so PCS leaves every header to it." + progTxt);
  if (m.startsWith("stale") || m.startsWith("idle")) return set("bios", "BIOS (PCS not running)",
    "No fresh requests from the dashboard: every header is back on its BIOS curve." + progTxt);
  return set("bad", "error", "Fan driver: " + esc(m) + progTxt);
}

// ---------------------------------------------------------------- why a header is where it is
function srcText(src) {
  const F = (FS && FS.fans) || {}, s = ST || {}, d = DET || {};
  const cw = num(F.fast_pkg_w) ? F.fast_pkg_w : s.cpu_w, gw = s.gpu_w;
  switch (src) {
    case "cpu_t": return `CPU ${r0(num(F.fast_pkg_t) ? F.fast_pkg_t : s.cpu_t) ?? "--"} °C`;
    case "cpu_w": return `CPU ${r0(cw) ?? "--"} W`;
    case "gpu_hot": return `GPU hot spot ${r0(s.gpu_hot) ?? "--"} °C`;
    case "gpu_mem": return "GPU memory temperature";
    case "gpu_w": return `GPU ${r0(gw) ?? "--"} W`;
    case "load_w": return `CPU + GPU ${num(cw) && num(gw) ? Math.round(cw + gw) : "--"} W`;
    case "vrm_t": return `VRM ${r0((d.cpu || {}).vrm_t) ?? "--"} °C`;
    case "water": return `water roof (${r0(Math.max(s.cube ?? -99, s.T1 ?? -99)) ?? "--"} °C)`;
    case "hot": return "hottest of CPU / GPU";
    default: return src ? src : "fast rule";
  }
}
function requestWhy(h, reqPct) {
  const Q = (ST && ST.req) || null, prog = ST ? (PROG[ST.program] || ST.name || "") : "";
  if (h.pump) {
    if (Q && num(Q.fast_p1) && num(reqPct) && Q.fast_p1 >= reqPct - 0.5) return `Instant P1 floor: ${Q.fast_p1_why || "load"}`;
    if (Q && Q.daily && Q.daily.p1_why) return `Daily: ${Q.daily.p1_why}`;
    return `${prog || "Program"} P1 rule`;
  }
  if (h.group === "psu") {
    const w = ST && num(ST.cpu_w) && num(ST.gpu_w) ? Math.round(ST.cpu_w + ST.gpu_w + 80) : null;
    return `PSU rule: ≈ ${w ?? "--"} W in use (40 % up to 400 W)`;
  }
  if (!Q) return "Request from the dashboard";
  if (Q.oc_fan_hot === true) return "Overclocking guard: CPU or VRM hot";
  if (Q.oc_fan_hot === false) return "Overclocking: PC fans held low";
  const D = Q.daily;
  if (D) {
    if (D.flush) return "Daily: case flush";
    if (h.group === "top" && !(D.rad > 0)) return `Daily: top floor (${D.why || "all cool"})`;
    if (h.group === "rads" && D.heat > 0) return "Daily: heater (case air into the coolant)";
    return `Daily: ${D.why || "guards"}`;
  }
  return `${prog || "Program"} rule`;
}
function explain(h, c) {
  const F = FS_ok && FS ? FS.fans || {} : {};
  if (c.k === "fc") return { t: "FanControl's curve" };
  if (c.k === "bios") {
    if (ST && ST.standalone) return { t: "Set by your BIOS or fan software", idle: true };
    if (h.pump && ST && ST.req && ST.req.req_p1 == null) return { t: "BIOS curve (P1 is set in the BIOS)", idle: true };
    if (!HDR.includes(h)) return { t: "BIOS curve (PCS doesn't drive this header)", idle: true };
    return { t: "BIOS curve", idle: true };
  }
  const req = FS && FS.req && FS.req.duty ? FS.req.duty[h.ch] : null;
  if (c.k === "pcs") {
    const fl = F.floor ? F.floor[h.ch] : null;
    if (num(fl) && fl > (req ?? 0) + 0.5) return { t: "Fast path: " + srcText(F.floor_why) + (h.group === "top" ? " (follows the rads)" : "") };
    return { t: requestWhy(h, req) };
  }
  // unknown controller: still say what the dashboard asks for
  if (!HDR.includes(h)) return { t: "Not driven by PCS", idle: true };
  if (h.pump && ST && ST.req && ST.req.req_p1 == null) return { t: "P1 is set in the BIOS", idle: true };
  return ST && ST.req ? { t: "Dashboard asks: " + requestWhy(h, ST.req[h.req]) } : { t: "–", idle: true };
}

// ---------------------------------------------------------------- cards
function cardHTML(h) {
  return `<div class="card fan" tabindex="0" data-ch="${h.ch}">
    <div class="top"><div class="nm"><b>${esc(h.name || h.nct)}</b><span>${esc(h.role)}${h.nct ? " · " + esc(h.nct) : ""}</span></div>
      <div class="who" data-f="who">–</div></div>
    <div class="nums"><div class="duty"><b data-f="duty">--</b><small>%</small><span class="k">duty</span></div>

  const now = Date.now();
  if (FS_ok !== false || now >= FS_next)             // no endpoint yet (service not restarted): ask again every 30 s
    jobs.push(getJSON("/fans/state").then(d => { FS = d; FS_ok = true; })
      .catch(e => { if (e.status === 404 || FS_ok !== true) { FS_ok = false; FS = null; FS_next = now + 30000; } }));
  await Promise.all(jobs);
  try {
    if (ST && ST.standalone && renderEditor()) {      // other PCs: editor (the board drawing stays on the left)
      if (mbDef) { if (!mbBuilt) { PCSBoard.draw($("mb"), mbDef); mbBuilt = true; } PCSBoard.update($("mb"), DET || {}, { roles: {} }); }
      return;
    }
    render();
  } catch (e) { console.error(e); }
}
tick(); setInterval(tick, 1000);
</script>
